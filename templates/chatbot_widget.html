<div id="chat-circle" style="background-color: #93215A;" class="btn btn-raised">
    <div id="chat-overlay"></div>
    <i class="material-icons">chat</i>
</div>

<div class="chat-box">
<div class="chat-box-header" style="background-color: #93215A;">
  Health Chat Bot
  <span class="chat-box-toggle"><i class="material-icons">close</i></span>
</div>
<div class="chat-box-body">
  <div class="chat-box-overlay">   
  </div>
  <div class="chat-logs">
   
  </div>
</div>
<div class="chat-input">      
  <form>
    <input type="text" id="chat-input" placeholder="Send a message..."/>
  <button type="submit" class="chat-submit" id="chat-submit"><i class="material-icons">send</i></button>
  </form>      
</div>
</div>
</div>
<script>
$(function()
{
    var INDEX = 0; 
    $("#chat-submit").click(function(e)
    {
        e.preventDefault();
        var user_input = $("#chat-input").val();
        if(user_input.trim() == '')
        {
            return false;
        }

        UserInput(user_input);

        $.get("/bothook", {
        msg: user_input
        }).done(function(data) {
            BotSays(data);  
        }).fail(function() { BotSays("The bot is unavailable. Please try again later."); });
    })

    function BotSays(msg)
    {
        setTimeout(function()
        {      
        generate_message(msg, 'user');  
        }, 1000)
    }  

    function UserInput(msg)
    {
        generate_message(msg, 'self');
    }

    function generate_message(msg, type)
    {
        INDEX++;
        var str="";
        str += "<div id='cm-msg-"+INDEX+"' class=\"chat-msg "+type+"\" mb-2>";
        str += "          <span class=\"msg-avatar\">";
        str += "            <img src=\"https:\/\/cdn-icons-png.flaticon.com\/512\/3177/3177440.png\">";
        str += "          <\/span>";
        str += "          <div class=\"cm-msg-text\">";
        str += $("<div>").text(msg).html();
        str += "          <\/div>";
        str += "        <\/div>";
        $(".chat-logs").append(str);
        $("#cm-msg-"+INDEX).hide().fadeIn(300);
        if(type == 'self'){
        $("#chat-input").val(''); 
        }    
        $(".chat-logs").stop().animate({ scrollTop: $(".chat-logs")[0].scrollHeight}, 1000);    
    }  

    $(document).delegate(".chat-btn", "click", function() {
    var value = $(this).attr("chat-value");
    var name = $(this).html();
    $("#chat-input").attr("disabled", false);
    UserInput(name);
    })

    $("#chat-circle").click(function() {    
    $("#chat-circle").toggle('scale');
    $(".chat-box").toggle('scale');
    })

    $(".chat-box-toggle").click(function() {
    $("#chat-circle").toggle('scale');
    $(".chat-box").toggle('scale');
    })

})
</script>
